services:
  postgres:
    image: postgres:16
    container_name: lotr_graphql_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lotr_user
      POSTGRES_PASSWORD: lotr_password
      POSTGRES_DB: lotr_wiki_db
    ports:
      - "5432:5432"
    volumes:
      - lotr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotr_user -d lotr_wiki_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    container_name: lotr_graphql_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lotr_user:lotr_password@postgres:5432/lotr_wiki_db?schema=public
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  lotr_postgres_data:
